{% extends 'base.html' %}

{% block title %}Eliminar Especialidad{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0">
            <div class="card-body text-center p-4">
                <i class="bi bi-exclamation-triangle text-warning display-3 mb-3 d-block"></i>
                <h4 class="fw-bold">¿Eliminar Especialidad?</h4>
                <p class="text-muted">¿Estás seguro de eliminar <strong>"{{ object.nombre }}"</strong>? Esta acción no se puede deshacer.</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-2 mt-4">
                        <a href="{% url 'clinica:lista_especialidades' %}" class="btn btn-outline-secondary px-4">Cancelar</a>
                        <button type="submit" class="btn btn-danger px-4 fw-bold">Sí, Eliminar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
