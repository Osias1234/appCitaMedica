{% load static %}
<!DOCTYPE html>
<html lang="es" class="h-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema de Citas Médicas{% endblock %}</title>
    
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- CSS Personalizado Profesional -->
   
    <!-- CSS Personalizado Profesional -->
    <link href="{% static 'css/estilos_clinica.css' %}" rel="stylesheet">
    {% block extra_css %}{% endblock %}
</head>
<body class="d-flex flex-column h-100 bg-light">

    <!-- Navbar principal / Sidebar -->
    {% include 'includes/sidebar.html' %}

    <!-- Mensajes del sistema -->
    {% include 'includes/messages.html' %}

    <!-- Botón superior móvil para mostrar la barra lateral -->
    <button class="btn btn-primary position-fixed top-0 start-0 m-3 d-lg-none shadow-sm" type="button" id="mobileSidebarToggle" style="z-index: 1050;">
      <i class="bi bi-list fs-5"></i>
    </button>

    <!-- Contenedor Principal con ID sincronizado -->
    <div id="mainContentWrapper">
        <main class="container-fluid p-4">
            {% block content %}
            <!-- Aquí renderizas las vistas de tus apps -->
            {% endblock %}
        </main>
    </div>

    <!-- Bootstrap 5.3 JS Bundle con Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
